name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-24.04 # 10-27: ubuntu-latest moved to 26.04, which has no node-gyp for the tree-sitter-powershell install script
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Typecheck
        run: bun turbo typecheck

  # 10-20: A11. Unit suites that are green today run on every push and PR. Add a suite here once
  # it is green. Known failures stay out until they are fixed, not deleted or snapshot-updated.
  # packages/core is green since audit 6 and runs in its own core-test job below. packages/tui is
  # green since 10-20 and runs below. The full packages/opencode suite (~7 min) is not run here yet.
  test:
    runs-on: ubuntu-24.04 # 10-27: ubuntu-latest moved to 26.04, which has no node-gyp for the tree-sitter-powershell install script
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Desktop unit tests
        working-directory: packages/desktop
        run: bun test

      - name: App unit tests
        working-directory: packages/app
        run: bun run test:unit

      - name: CLI Remote Control tests
        working-directory: packages/opencode
        run: bun test --timeout 30000 test/remote

      - name: CLI help snapshots
        working-directory: packages/opencode
        run: bun test --timeout 30000 test/cli/help

      - name: TUI unit tests
        working-directory: packages/tui
        run: bun test --timeout 30000

      - name: Library unit tests (llm, ui, http-recorder, effect-drizzle-sqlite)
        run: |
          set -e
          for pkg in llm ui http-recorder effect-drizzle-sqlite; do
            echo "== packages/$pkg"
            (cd "packages/$pkg" && bun run test)
          done

  # Core suite (packages/core, ~40 s locally), its own job so a core failure is easy to spot.
  core-test:
    runs-on: ubuntu-24.04 # 10-27: ubuntu-latest moved to 26.04, which has no node-gyp for the tree-sitter-powershell install script
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Core unit tests
        working-directory: packages/core
        run: bun test --timeout 30000

  build:
    runs-on: ubuntu-24.04 # 10-27: ubuntu-latest moved to 26.04, which has no node-gyp for the tree-sitter-powershell install script
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build single binary
        working-directory: packages/opencode
        run: bun run script/build.ts --single

      - name: Smoke test binary
        working-directory: packages/opencode
        run: ./dist/opencode-linux-x64/bin/opencode --version
