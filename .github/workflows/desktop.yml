name: desktop

# Builds the Praex desktop app (Electron) for every OS and attaches the installers to the
# workflow run. Nothing is published from here: download the artifacts, verify them, then
# upload to gs://praex-web-data/dl/desktop/ with the release script.
#
# No Developer ID signing yet:
#   macOS: CSC_IDENTITY_AUTO_DISCOVERY=false skips the keychain search and the app is signed ad
#          hoc (electron-builder.config.ts); notarization stays off until
#          APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER are set as secrets.
#   Windows: signing only runs when AZURE_CLIENT_ID is present (see electron-builder.config.ts).

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-24.04
            name: linux-x64
            platform_flag: --linux
          - host: macos-15
            name: mac-arm64
            platform_flag: --mac --arm64
          - host: macos-15-intel
            name: mac-x64
            platform_flag: --mac --x64
          - host: windows-2025
            name: win-x64
            platform_flag: --win
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 60
    env:
      OPENCODE_CHANNEL: prod
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # setup-node v4 caches only when a `cache:` input is set, and none is,
      # so a release build reads no cache another run could have written.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "24"

      - name: Install rpm tooling (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - name: Fetch the Electron runtime
        # bun does not run electron's postinstall (not in trustedDependencies), so the
        # runtime zip has to be fetched explicitly before electron-builder can package it.
        working-directory: packages/desktop
        # Resolve through Node so it works whether bun nests electron under
        # packages/desktop/node_modules (linux/mac) or hoists it to the root (windows).
        run: node "$(node -p "require.resolve('electron/install.js')")"

      - name: Prebuild (icons, metainfo, server bundle)
        working-directory: packages/desktop
        run: bun ./scripts/prebuild.ts

      - name: Build
        working-directory: packages/desktop
        # The main-process bundle inlines the ~23 MB server bundle; the default Node heap OOMs.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: bun run build

      - name: Package
        working-directory: packages/desktop
        run: npx electron-builder ${{ matrix.settings.platform_flag }} --publish never --config electron-builder.config.ts

      - name: List artifacts
        working-directory: packages/desktop/dist
        shell: bash
        run: ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: praex-desktop-${{ matrix.settings.name }}
          if-no-files-found: error
          path: |
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest*.yml
